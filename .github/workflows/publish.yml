name: Publish to npm

# 发布 @qiyangxy/tedb-electron-storage 到 npm：
# - 推送 v* 标签触发（如 v0.6.0）
# - 或在 Actions 页手动触发（workflow_dispatch）
# npm 发布成功后自动创建 GitHub Release，说明取自 CHANGELOG.md 对应版本小节
# （.github/extract-changelog.cjs 提取；无对应小节时回退为 CHANGELOG 链接）
#
# 采用 npm **Trusted Publishing**（OIDC 可信发布，无 NPM_TOKEN secret）：
# 前置一次性配置（npmjs.com 包设置页）：
#   包 @qiyangxy/tedb-electron-storage → Settings → Trusted Publisher：
#     Repository owner: myadream
#     Repository name:  tedb-electron-storage
#     Workflow filename: publish.yml   ← 必须与本文件名完全一致
# 另需 npm CLI ≥ 11.5.1（工作流内已强制升级），GitHub 侧需 id-token: write 权限

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 必需
  id-token: write # npm Trusted Publishing（OIDC）必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 字段（pnpm@10）驱动版本，无需显式指定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted Publishing 要求 npm ≥ 11.5.1，跑在旧版 npm 的 runner 上先升级
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - name: Publish (skip if version already on npm)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@qiyangxy/tedb-electron-storage@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published — nothing to do"
          else
            npm publish --access public
          fi

  # 仅标签触发时执行：npm 发布成功后创建同名 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          if node .github/extract-changelog.cjs "${TAG#v}" > RELEASE_BODY.md; then
            echo "Extracted CHANGELOG section for ${TAG}"
          else
            echo "No CHANGELOG section for ${TAG} — falling back to link"
            echo "See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)." > RELEASE_BODY.md
          fi

      # 已存在同名 Release（重跑/重推标签）时改为更新其标题与说明
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_BODY.md ||
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_BODY.md
