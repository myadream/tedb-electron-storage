name: Publish to npm

# 发布 @qiyangxy/tedb-electron-storage 到 npm：
# - 推送 v* 标签触发（如 v0.6.0）
# - 或在 Actions 页手动触发（workflow_dispatch）
#
# 采用 npm **Trusted Publishing**（OIDC 可信发布，无 NPM_TOKEN secret）：
# 前置一次性配置（npmjs.com 包设置页）：
#   包 @qiyangxy/tedb-electron-storage → Settings → Trusted Publisher：
#     Repository owner: myadream
#     Repository name:  tedb-electron-storage
#     Workflow filename: publish.yml   ← 必须与本文件名完全一致
# 另需 npm CLI ≥ 11.5.1（工作流内已强制升级），GitHub 侧需 id-token: write 权限

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing（OIDC）必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 字段（pnpm@10）驱动版本，无需显式指定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted Publishing 要求 npm ≥ 11.5.1，跑在旧版 npm 的 runner 上先升级
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - name: Publish (skip if version already on npm)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@qiyangxy/tedb-electron-storage@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published — nothing to do"
          else
            npm publish --access public
          fi
